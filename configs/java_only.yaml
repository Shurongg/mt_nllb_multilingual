mode: java_only
model_name: /mnt/models/facebook/nllb-200-distilled-600M
train_file: data/processed/jav_eng/train.jsonl
dev_file: data/processed/jav_eng/dev.jsonl
test_file: data/processed/jav_eng/test.jsonl
output_dir: outputs/java_only/jav_eng
target_lang: eng_Latn
num_beams: 5
seed: 42

training:
  learning_rate: 2e-5
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  warmup_ratio: 0.1
  weight_decay: 0.01
  label_smoothing_factor: 0.0
  fp16: true
  max_source_length: 128
  max_target_length: 128

